<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1942 Boss Edition - Arcade</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050811;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 35px rgba(0, 153, 255, 0.3);
      border-radius: 8px;
      overflow: hidden;
      background-color: #000;
    }

    #game-container::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }

    #ui {
      width: 360px;
      padding: 8px 12px;
      background-color: #0b1526;
      border: 2px solid #33aaff;
      border-bottom: none;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      color: #33aaff;
      text-shadow: 0 0 4px #33aaff;
    }

    canvas {
      border: 2px solid #33aaff;
      background-color: #004488;
      image-rendering: pixelated;
      display: block;
    }

    #instructions {
      width: 360px;
      background-color: #0b1526;
      border: 2px solid #33aaff;
      border-top: none;
      padding: 8px;
      font-size: 11px;
      text-align: center;
      color: #88bbdd;
    }

    .key {
      color: #fff;
      border: 1px solid #4488bb;
      padding: 1px 4px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="ui">
      <div>SCORE: <span id="score">0</span> | LVL: <span id="level">1</span></div>
      <div>BOMBES: <span id="bombs">💣💣</span></div>
    </div>
    <canvas id="gameCanvas" width="360" height="500"></canvas>
    <div id="instructions">
      <span class="key">Flèches</span> Déplacer | <span class="key">ESPACE</span> Tirer | <span class="key">R</span> Tonneau | <span class="key">B</span> Bombe
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const bombsEl = document.getElementById('bombs');

    let score = 0;
    let level = 1;
    let killsInLevel = 0;
    const KILLS_TO_BOSS = 25;

    let bombs = 2;
    let gameOver = false;
    let victory = false;
    let shakeTimer = 0;
    let oceanOffsetY = 0;

    // --- AUDIO ---
    let audioCtx = null;
    let engineOscillator = null;
    let engineGain = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startEngineSound();
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function startEngineSound() {
      try {
        engineOscillator = audioCtx.createOscillator();
        engineGain = audioCtx.createGain();
        engineOscillator.type = 'sawtooth';
        engineOscillator.frequency.value = 50;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 200;

        engineOscillator.connect(filter);
        filter.connect(engineGain);
        engineGain.connect(audioCtx.destination);
        engineGain.gain.value = 0.05;
        engineOscillator.start();
      } catch (e) {}
    }

    function playSound(freq, duration, type = 'square', vol = 0.1) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playExplosionSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(130, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {}
    }

    // --- INPUTS ---
    const keys = {};
    window.addEventListener('keydown', (e) => {
      initAudio();
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyR', 'KeyB', 'Enter'].includes(e.code)) {
        e.preventDefault();
      }
      keys[e.code] = true;

      if (e.code === 'KeyB' && !gameOver) triggerBomb();
      if ((gameOver || victory) && (e.code === 'Enter' || e.code === 'KeyR')) restartGame();
    });

    window.addEventListener('keyup', (e) => keys[e.code] = false);

    // --- DECOR ---
    const islands = Array.from({ length: 3 }, () => ({
      x: Math.random() * (canvas.width - 60),
      y: Math.random() * canvas.height,
      size: 30 + Math.random() * 30
    }));

    const clouds = Array.from({ length: 5 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: 25 + Math.random() * 25,
      speed: 0.8 + Math.random() * 0.6
    }));

    // --- ENTITÉS ---
    const player = {
      x: canvas.width / 2 - 12,
      y: canvas.height - 65,
      width: 24,
      height: 24,
      speed: 3.5,
      lastShot: 0,
      shootDelay: 140,
      isRolling: false,
      rollAngle: 0,
      rollDuration: 550,
      lastRoll: 0,
      rollCooldown: 2500,
      doubleShot: false,
      doubleShotTimer: 0
    };

    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let powerups = [];
    let particles = [];
    let currentBoss = null;

    // --- BOSS LOGIC ---
    function spawnBoss() {
      if (level === 1) {
        currentBoss = {
          x: canvas.width / 2 - 60,
          y: -100,
          targetY: 40,
          width: 120,
          height: 60,
          hp: 70,
          maxHp: 70,
          dir: 1,
          speed: 1.2,
          lastShot: Date.now(),
          type: 1,
          name: "BOMBARDIER B-17 RED SKULL"
        };
      } else if (level === 2) {
        currentBoss = {
          x: canvas.width / 2 - 70,
          y: -100,
          targetY: 50,
          width: 140,
          height: 55,
          hp: 110,
          maxHp: 110,
          dir: 1,
          speed: 2.8,
          lastShot: Date.now(),
          invisible: false,
          stealthTimer: 0,
          type: 2,
          name: "AILE VOLANTE SHADOW B-2"
        };
      } else if (level === 3) {
        currentBoss = {
          x: canvas.width / 2 - 90,
          y: -120,
          targetY: 30,
          width: 180,
          height: 80,
          hp: 160,
          maxHp: 160,
          dir: 1,
          speed: 0.9,
          lastShot: Date.now(),
          type: 3,
          name: "FORTERESSE TITAN B-52"
        };
      }
    }

    function updateBoss() {
      if (!currentBoss) return;

      if (currentBoss.y < currentBoss.targetY) {
        currentBoss.y += 1;
        return;
      }

      const now = Date.now();

      if (currentBoss.type === 1) {
        currentBoss.x += currentBoss.speed * currentBoss.dir;
        if (currentBoss.x <= 10 || currentBoss.x + currentBoss.width >= canvas.width - 10) {
          currentBoss.dir *= -1;
        }

        if (now - currentBoss.lastShot > 1000) {
          enemyBullets.push({ x: currentBoss.x + 20, y: currentBoss.y + currentBoss.height, width: 4, height: 8, speed: 3.5, vx: -0.8 });
          enemyBullets.push({ x: currentBoss.x + currentBoss.width / 2 - 2, y: currentBoss.y + currentBoss.height, width: 6, height: 10, speed: 4, vx: 0 });
          enemyBullets.push({ x: currentBoss.x + currentBoss.width - 20, y: currentBoss.y + currentBoss.height, width: 4, height: 8, speed: 3.5, vx: 0.8 });
          playSound(200, 0.15, 'sawtooth', 0.1);
          currentBoss.lastShot = now;
        }
      } 
      else if (currentBoss.type === 2) {
        currentBoss.x += currentBoss.speed * currentBoss.dir;
        if (currentBoss.x <= 10 || currentBoss.x + currentBoss.width >= canvas.width - 10) {
          currentBoss.dir *= -1;
        }

        currentBoss.stealthTimer++;
        if (currentBoss.stealthTimer > 180) {
          currentBoss.invisible = !currentBoss.invisible;
          currentBoss.stealthTimer = 0;
          if (currentBoss.invisible) {
            currentBoss.x = Math.random() * (canvas.width - currentBoss.width);
          }
        }

        if (!currentBoss.invisible && now - currentBoss.lastShot > 600) {
          enemyBullets.push({ x: currentBoss.x + 30, y: currentBoss.y + currentBoss.height - 10, width: 4, height: 8, speed: 4.5, vx: -0.5 });
          enemyBullets.push({ x: currentBoss.x + currentBoss.width / 2 - 2, y: currentBoss.y + currentBoss.height, width: 5, height: 9, speed: 5, vx: 0 });
          enemyBullets.push({ x: currentBoss.x + currentBoss.width - 30, y: currentBoss.y + currentBoss.height - 10, width: 4, height: 8, speed: 4.5, vx: 0.5 });
          playSound(350, 0.08, 'sawtooth', 0.08);
          currentBoss.lastShot = now;
        }
      }
      else if (currentBoss.type === 3) {
        currentBoss.x += currentBoss.speed * currentBoss.dir;
        if (currentBoss.x <= 5 || currentBoss.x + currentBoss.width >= canvas.width - 5) {
          currentBoss.dir *= -1;
        }

        if (now - currentBoss.lastShot > 750) {
          enemyBullets.push({ x: currentBoss.x + 15, y: currentBoss.y + 45, width: 4, height: 8, speed: 3.8, vx: -1.2 });
          enemyBullets.push({ x: currentBoss.x + 45, y: currentBoss.y + 55, width: 4, height: 8, speed: 4, vx: -0.4 });
          enemyBullets.push({ x: currentBoss.x + currentBoss.width / 2 - 4, y: currentBoss.y + currentBoss.height, width: 8, height: 12, speed: 4.5, vx: 0 });
          enemyBullets.push({ x: currentBoss.x + currentBoss.width - 45, y: currentBoss.y + 55, width: 4, height: 8, speed: 4, vx: 0.4 });
          enemyBullets.push({ x: currentBoss.x + currentBoss.width - 15, y: currentBoss.y + 45, width: 4, height: 8, speed: 3.8, vx: 1.2 });
          playSound(180, 0.15, 'square', 0.12);
          currentBoss.lastShot = now;
        }
      }
    }

    // --- RESTART ---
    function restartGame() {
      score = 0;
      level = 1;
      killsInLevel = 0;
      bombs = 2;
      gameOver = false;
      victory = false;
      bullets = [];
      enemyBullets = [];
      enemies = [];
      powerups = [];
      particles = [];
      currentBoss = null;
      player.x = canvas.width / 2 - 12;
      player.y = canvas.height - 65;
      player.doubleShot = false;
      scoreEl.innerText = score;
      levelEl.innerText = level;
      bombsEl.innerText = '💣'.repeat(bombs);
      if (engineGain) engineGain.gain.value = 0.05;
      requestAnimationFrame(gameLoop);
    }

    function triggerBomb() {
      if (bombs <= 0) return;
      bombs--;
      bombsEl.innerText = '💣'.repeat(bombs);
      shakeTimer = 20;
      playSound(150, 0.5, 'sawtooth', 0.3);

      enemyBullets = [];

      enemies.forEach(e => {
        e.hp -= 5;
        if (e.hp <= 0) {
          e.destroyed = true;
          score += 100;
          createExplosion(e.x + e.width / 2, e.y + e.height / 2, '#ff6600', 18);
        }
      });

      if (currentBoss && !currentBoss.invisible) {
        currentBoss.hp -= 20;
        createExplosion(currentBoss.x + currentBoss.width / 2, currentBoss.y + currentBoss.height / 2, '#ffaa00', 30);
        if (currentBoss.hp <= 0) killBoss();
      }

      scoreEl.innerText = score;
    }

    function killBoss() {
      playExplosionSound();
      createExplosion(currentBoss.x + currentBoss.width / 2, currentBoss.y + currentBoss.height / 2, '#ff2200', 50);
      shakeTimer = 30;
      score += level * 1500;
      scoreEl.innerText = score;
      currentBoss = null;

      if (level < 3) {
        level++;
        killsInLevel = 0;
        levelEl.innerText = level;
      } else {
        victory = true;
      }
    }

    function createExplosion(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          size: Math.random() * 3 + 1,
          color, life: 22
        });
      }
    }

    function spawnPowerup(x, y) {
      if (Math.random() < 0.25) {
        const types = ['double', 'roll'];
        powerups.push({
          x, y, width: 14, height: 14,
          type: types[Math.floor(Math.random() * types.length)],
          speed: 1.2
        });
      }
    }

    // --- LOGIQUE METIER ---
    function updatePlayer() {
      const now = Date.now();
      let isMoving = false;

      if (keys['ArrowLeft'] && player.x > 0) { player.x -= player.speed; isMoving = true; }
      if (keys['ArrowRight'] && player.x < canvas.width - player.width) { player.x += player.speed; isMoving = true; }
      if (keys['ArrowUp'] && player.y > 0) { player.y -= player.speed; isMoving = true; }
      if (keys['ArrowDown'] && player.y < canvas.height - player.height) { player.y += player.speed; isMoving = true; }

      if (engineOscillator) {
        engineOscillator.frequency.setTargetAtTime(isMoving ? 62 : 50, audioCtx.currentTime, 0.1);
      }

      if (keys['KeyR'] && !player.isRolling && now - player.lastRoll > player.rollCooldown) {
        player.isRolling = true;
        player.lastRoll = now;
        playSound(300, 0.4, 'sine', 0.12);
      }

      if (player.isRolling) {
        const elapsed = now - player.lastRoll;
        if (elapsed < player.rollDuration) {
          player.rollAngle = (elapsed / player.rollDuration) * 360;
        } else {
          player.isRolling = false;
          player.rollAngle = 0;
        }
      }

      if (player.doubleShotTimer > 0 && --player.doubleShotTimer === 0) player.doubleShot = false;

      if (keys['Space'] && now - player.lastShot > player.shootDelay) {
        if (player.doubleShot) {
          bullets.push({ x: player.x, y: player.y - 6, width: 3, height: 8, speed: 7 });
          bullets.push({ x: player.x + player.width - 3, y: player.y - 6, width: 3, height: 8, speed: 7 });
        } else {
          bullets.push({ x: player.x + player.width / 2 - 1.5, y: player.y - 6, width: 3, height: 8, speed: 7 });
        }
        playSound(650, 0.08, 'square', 0.08);
        player.lastShot = now;
      }
    }

    function spawnEnemies() {
      if (currentBoss) return;

      if (killsInLevel >= KILLS_TO_BOSS && !currentBoss) {
        spawnBoss();
        return;
      }

      if (Math.random() < 0.02 + (level * 0.005)) {
        const isHeavy = Math.random() < 0.25;
        enemies.push({
          x: Math.random() * (canvas.width - 32),
          y: -30,
          width: isHeavy ? 32 : 20,
          height: isHeavy ? 28 : 20,
          speed: isHeavy ? 1.3 : 2.2 + (level * 0.2),
          type: isHeavy ? 'heavy' : 'light',
          hp: isHeavy ? 4 : 1,
          lastShot: Date.now(),
          shootDelay: isHeavy ? 1200 : 1600
        });
      }
    }

    function updateEnemies() {
      const now = Date.now();
      enemies.forEach(e => {
        e.y += e.speed;
        if (now - e.lastShot > e.shootDelay && e.y > 0 && e.y < canvas.height - 80) {
          if (e.type === 'heavy') {
            enemyBullets.push({ x: e.x + 6, y: e.y + e.height, width: 4, height: 6, speed: 3.5, vx: 0 });
            enemyBullets.push({ x: e.x + e.width - 10, y: e.y + e.height, width: 4, height: 6, speed: 3.5, vx: 0 });
          } else {
            enemyBullets.push({ x: e.x + e.width / 2 - 2, y: e.y + e.height, width: 4, height: 6, speed: 4, vx: 0 });
          }
          playSound(250, 0.1, 'sawtooth', 0.05);
          e.lastShot = now;
        }
      });
      enemies = enemies.filter(e => e.y < canvas.height + 30 && !e.destroyed);
    }

    function isColliding(r1, r2) {
      return (
        r1.x < r2.x + r2.width &&
        r1.x + r1.width > r2.x &&
        r1.y < r2.y + r2.height &&
        r1.y + r1.height > r2.y
      );
    }

    function checkCollisions() {
      bullets.forEach(b => {
        enemies.forEach(e => {
          if (!b.destroyed && !e.destroyed && isColliding(b, e)) {
            b.destroyed = true;
            e.hp--;
            if (e.hp <= 0) {
              e.destroyed = true;
              killsInLevel++;
              score += e.type === 'heavy' ? 300 : 100;
              spawnPowerup(e.x, e.y);
              createExplosion(e.x + e.width / 2, e.y + e.height / 2, e.type === 'heavy' ? '#ff3300' : '#ffff00');
              playExplosionSound();
            }
          }
        });

        if (currentBoss && !b.destroyed && (!currentBoss.invisible)) {
          if (isColliding(b, currentBoss)) {
            b.destroyed = true;
            currentBoss.hp--;
            createExplosion(b.x, b.y, '#ffffff', 3);
            playSound(500, 0.03, 'square', 0.05);

            if (currentBoss.hp <= 0) killBoss();
          }
        }
      });

      powerups.forEach((p, idx) => {
        p.y += p.speed;
        if (isColliding(p, player)) {
          if (p.type === 'double') { player.doubleShot = true; player.doubleShotTimer = 450; }
          if (p.type === 'roll') { player.lastRoll = 0; }
          playSound(900, 0.12, 'sine', 0.15);
          powerups.splice(idx, 1);
        }
      });

      bullets = bullets.filter(b => b.y > -10 && !b.destroyed);

      if (player.isRolling) return;

      enemies.forEach(e => {
        if (!e.destroyed && isColliding(player, e)) gameOver = true;
      });

      if (currentBoss && !currentBoss.invisible && isColliding(player, currentBoss)) {
        gameOver = true;
      }

      enemyBullets.forEach(eb => {
        if (!eb.destroyed && isColliding(player, eb)) gameOver = true;
      });

      if (gameOver) playExplosionSound();
      scoreEl.innerText = score;
    }

    // --- DESSIN DES BOSSES AMÉLIORÉS ---
    function drawBoss() {
      if (!currentBoss || currentBoss.invisible) return;

      const bx = currentBoss.x;
      const by = currentBoss.y;
      const bw = currentBoss.width;
      const bh = currentBoss.height;

      // --- BOSS 1: BOMBARDIER ROUGE QUADRIMOTEUR ---
      if (currentBoss.type === 1) {
        // Ailes principales
        ctx.fillStyle = '#991111';
        ctx.fillRect(bx, by + 18, bw, 18);

        // Fuselage Central
        ctx.fillStyle = '#dd3333';
        ctx.fillRect(bx + bw / 2 - 12, by, 24, bh);

        // Nez / Cockpit
        ctx.fillStyle = '#ffff55';
        ctx.fillRect(bx + bw / 2 - 6, by + 4, 12, 10);

        // 4 Moteurs à hélices
        ctx.fillStyle = '#444';
        ctx.fillRect(bx + 15, by + 12, 8, 22);
        ctx.fillRect(bx + 38, by + 12, 8, 22);
        ctx.fillRect(bx + bw - 46, by + 12, 8, 22);
        ctx.fillRect(bx + bw - 23, by + 12, 8, 22);

        // Hélices (Jaunes)
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(bx + 13, by + 34, 12, 3);
        ctx.fillRect(bx + 36, by + 34, 12, 3);
        ctx.fillRect(bx + bw - 48, by + 34, 12, 3);
        ctx.fillRect(bx + bw - 25, by + 34, 12, 3);

        // Empennage Arrière
        ctx.fillStyle = '#770000';
        ctx.fillRect(bx + bw / 2 - 25, by + bh - 8, 50, 6);
      }

      // --- BOSS 2: AILE VOLANTE PURPLE STEALTH ---
      else if (currentBoss.type === 2) {
        // Structure de l'Aile Volante (Delta)
        ctx.fillStyle = '#5511aa';
        ctx.beginPath();
        ctx.moveTo(bx + bw / 2, by);
        ctx.lineTo(bx + bw, by + bh);
        ctx.lineTo(bx + bw - 20, by + bh - 10);
        ctx.lineTo(bx + bw / 2, by + bh - 4);
        ctx.lineTo(bx + 20, by + bh - 10);
        ctx.lineTo(bx, by + bh);
        ctx.closePath();
        ctx.fill();

        // Détails / Turbines Furtives
        ctx.fillStyle = '#aa44ff';
        ctx.fillRect(bx + bw / 2 - 18, by + 16, 36, 12);

        // Cockpit
        ctx.fillStyle = '#00ffff';
        ctx.fillRect(bx + bw / 2 - 5, by + 10, 10, 8);

        // Tère Canon Central
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bx + bw / 2 - 2, by + bh - 8, 4, 10);
      }

      // --- BOSS 3: MONSTRE DU CIEL B-52 OCTOMOTEUR ---
      else if (currentBoss.type === 3) {
        // Ailes géantes
        ctx.fillStyle = '#334455';
        ctx.fillRect(bx, by + 25, bw, 22);

        // Fuselage lourd
        ctx.fillStyle = '#556677';
        ctx.fillRect(bx + bw / 2 - 20, by, 40, bh);

        // Cockpit blindé
        ctx.fillStyle = '#88eeff';
        ctx.fillRect(bx + bw / 2 - 10, by + 6, 20, 12);

        // Tourelles latérales
        ctx.fillStyle = '#111';
        ctx.fillRect(bx + 12, by + 40, 10, 15);
        ctx.fillRect(bx + bw - 22, by + 40, 10, 15);

        // 8 Moteurs à Réacteurs
        ctx.fillStyle = '#222';
        for (let i = 0; i < 4; i++) {
          ctx.fillRect(bx + 20 + (i * 12), by + 20, 7, 30);
          ctx.fillRect(bx + bw - 27 - (i * 12), by + 20, 7, 30);
        }

        // Flammes des réacteurs
        ctx.fillStyle = '#ff5500';
        for (let i = 0; i < 4; i++) {
          ctx.fillRect(bx + 21 + (i * 12), by + 16, 5, 4);
          ctx.fillRect(bx + bw - 26 - (i * 12), by + 16, 5, 4);
        }

        // Double Aileron Arrière
        ctx.fillStyle = '#223344';
        ctx.fillRect(bx + bw / 2 - 35, by + bh - 10, 12, 8);
        ctx.fillRect(bx + bw / 2 + 23, by + bh - 10, 12, 8);
      }
    }

    function drawBossBar() {
      if (!currentBoss) return;

      const barWidth = 220;
      const barHeight = 10;
      const x = canvas.width / 2 - barWidth / 2;
      const y = 12;

      ctx.fillStyle = '#111';
      ctx.fillRect(x - 2, y - 2, barWidth + 4, barHeight + 4);

      const pct = Math.max(0, currentBoss.hp / currentBoss.maxHp);
      ctx.fillStyle = level === 1 ? '#ff3333' : level === 2 ? '#aa33ff' : '#00ccff';
      ctx.fillRect(x, y, barWidth * pct, barHeight);

      ctx.fillStyle = '#ffffff';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(currentBoss.name, canvas.width / 2, y - 4);
    }

    function draw() {
      ctx.save();

      if (shakeTimer > 0) {
        shakeTimer--;
        ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
      }

      oceanOffsetY += 1;
      if (oceanOffsetY >= 40) oceanOffsetY = 0;
      ctx.fillStyle = '#004488';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#003366';
      islands.forEach(is => {
        is.y += 0.5;
        if (is.y > canvas.height + 40) is.y = -50;
        ctx.beginPath();
        ctx.arc(is.x, is.y, is.size, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = '#0066aa';
      for (let y = oceanOffsetY - 40; y < canvas.height; y += 40) {
        for (let x = 10; x < canvas.width; x += 60) {
          ctx.fillRect(x, y, 18, 3);
        }
      }

      // --- JOUEUR ---
      ctx.save();
      ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
      if (player.isRolling) {
        ctx.rotate((player.rollAngle * Math.PI) / 180);
        const scaleX = Math.cos((player.rollAngle * Math.PI) / 180);
        ctx.scale(scaleX === 0 ? 0.1 : scaleX, 1);
      }
      ctx.fillStyle = player.isRolling ? '#00ffff' : '#ffffff';
      ctx.fillRect(-2, -12, 4, 24);     // Fuselage
      ctx.fillRect(-12, -4, 24, 6);     // Ailes
      ctx.fillRect(-6, 8, 12, 4);       // Empennage
      ctx.restore();

      // --- ENNEMIS ---
      enemies.forEach(e => {
        ctx.fillStyle = e.type === 'heavy' ? '#ff9900' : '#ff3333';
        if (e.type === 'heavy') {
          ctx.fillRect(e.x + 12, e.y, 8, 28);      // Fuselage
          ctx.fillRect(e.x, e.y + 8, 32, 8);       // Ailes principales
          ctx.fillRect(e.x + 8, e.y + 22, 16, 4);  // Empennage arrière
        } else {
          ctx.fillRect(e.x + 8, e.y, 4, 20);       // Fuselage
          ctx.fillRect(e.x, e.y + 6, 20, 6);       // Ailes
          ctx.fillRect(e.x + 5, e.y + 16, 10, 4);  // Empennage arrière
        }
      });

      // --- BOSS ---
      drawBoss();

      // --- POWERUPS ---
      powerups.forEach(p => {
        ctx.fillStyle = p.type === 'double' ? '#00ff66' : '#ffff00';
        ctx.fillRect(p.x, p.y, p.width, p.height);
      });

      // --- TIRS ---
      ctx.fillStyle = '#ffff00';
      bullets.forEach(b => {
        b.y -= b.speed;
        ctx.fillRect(b.x, b.y, b.width, b.height);
      });

      ctx.fillStyle = '#ff6600';
      enemyBullets.forEach(eb => {
        eb.y += eb.speed;
        if (eb.vx) eb.x += eb.vx;
        ctx.fillRect(eb.x, eb.y, eb.width, eb.height);
      });
      enemyBullets = enemyBullets.filter(eb => eb.y < canvas.height + 10);

      // --- PARTICULES ---
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.life--;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });
      particles = particles.filter(p => p.life > 0);

      // --- HUD BOSS ---
      drawBossBar();

      // --- NUAGES ---
      ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
      clouds.forEach(c => {
        c.y += c.speed;
        if (c.y > canvas.height + 30) c.y = -40;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();
    }

    function gameLoop() {
      if (gameOver) {
        if (engineGain) engineGain.gain.value = 0;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff3333';
        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('MISSION ÉCHOUÉE', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#ffffff';
        ctx.font = '13px monospace';
        ctx.fillText(`Score Final: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
        ctx.fillStyle = '#33aaff';
        ctx.fillText('Appuyez sur ENTRÉE pour rejouer', canvas.width / 2, canvas.height / 2 + 55);
        return;
      }

      if (victory) {
        if (engineGain) engineGain.gain.value = 0;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ff66';
        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('VICTOIRE TOTALE !', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#ffffff';
        ctx.font = '13px monospace';
        ctx.fillText(`Score Final: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
        ctx.fillStyle = '#33aaff';
        ctx.fillText('Appuyez sur ENTRÉE pour recommencer', canvas.width / 2, canvas.height / 2 + 55);
        return;
      }

      updatePlayer();
      spawnEnemies();
      updateEnemies();
      updateBoss();
      checkCollisions();
      draw();

      scoreEl.innerText = score;
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
